name: Feature request
description: Discuss a concrete use case before implementation.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: Who needs this, and what cannot they do today? Use synthetic examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and any access-control implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing workflows or an offline-analysis approach where relevant.
